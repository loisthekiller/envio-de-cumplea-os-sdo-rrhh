version: '3.8'

# ============================================
# Docker Compose - Entorno de DESARROLLO
# ============================================

services:
  api:
    container_name: cumple-api-dev
    build:
      context: ../..
      dockerfile: docker/images/Dockerfile
    image: sanatorio-cumpleanos-api:dev
    restart: unless-stopped

    # Variables de entorno desde archivo
    env_file:
      - ../../.env

    # Variables específicas de desarrollo
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      TZ: America/Argentina/Buenos_Aires

    # Puertos expuestos
    ports:
      - "3000:3000"

    # Volúmenes para desarrollo (hot reload)
    volumes:
      - ../../src:/app/src:ro
      - ../../uploads:/app/uploads
      - ../../logs:/app/logs

    # Healthcheck
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:3000/status" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    # Límites de recursos (desarrollo)
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

    # Redes
    networks:
      - cumple-network

# Redes
networks:
  cumple-network:
    driver: bridge
    name: cumple-dev-network

# Volúmenes nombrados (si se necesitan en el futuro)
volumes:
  uploads-dev:
  logs-dev:
